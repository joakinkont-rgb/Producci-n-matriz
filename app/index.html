<title>Producción Matriz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EFF2F3; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#E8EDEF;
  --ink:#12191D; --ink-2:#4A5860; --ink-3:#7B8B94;
  --line:#D6DEE1; --line-strong:#B4C1C6;
  --accent:#0E6E7D; --accent-ink:#FFFFFF; --accent-soft:#DBEBEE; --accent-line:#8FC2CA;
  --ok:#2C7A51; --ok-soft:#DCEFE4;
  --warn:#8F5D0F; --warn-soft:#F6E9D2;
  --crit:#A83A2E; --crit-soft:#F7DED9;
  --z-secos:#A9761F; --z-verdura:#3E7B3C; --z-carnico:#A4443F; --z-congelador:#2E6C93;
  --z-refrigerado:#2E7F7A; --z-noalimento:#6B7A85;
  --shadow:0 1px 2px rgba(18,25,29,.06), 0 6px 18px -10px rgba(18,25,29,.24);
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1417; --surface:#161E22; --surface-2:#1B252A; --surface-3:#222F35;
    --ink:#E6EDEF; --ink-2:#9DAEB5; --ink-3:#6E828A;
    --line:#26343A; --line-strong:#3A4C54;
    --accent:#35A8BC; --accent-ink:#05171B; --accent-soft:#12333A; --accent-line:#2A6b78;
    --ok:#4FAE7B; --ok-soft:#123526;
    --warn:#C9963E; --warn-soft:#3A2D12;
    --crit:#D9685A; --crit-soft:#3B1C18;
    --z-secos:#D3A44E; --z-verdura:#74AF70; --z-carnico:#D07A72; --z-congelador:#6BA6CC;
    --z-refrigerado:#5FB8B1; --z-noalimento:#94A6B0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1417; --surface:#161E22; --surface-2:#1B252A; --surface-3:#222F35;
  --ink:#E6EDEF; --ink-2:#9DAEB5; --ink-3:#6E828A;
  --line:#26343A; --line-strong:#3A4C54;
  --accent:#35A8BC; --accent-ink:#05171B; --accent-soft:#12333A; --accent-line:#2A6b78;
  --ok:#4FAE7B; --ok-soft:#123526;
  --warn:#C9963E; --warn-soft:#3A2D12;
  --crit:#D9685A; --crit-soft:#3B1C18;
  --z-secos:#D3A44E; --z-verdura:#74AF70; --z-carnico:#D07A72; --z-congelador:#6BA6CC;
  --z-refrigerado:#5FB8B1; --z-noalimento:#94A6B0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5;
}
h1,h2,h3,h4{font-family:Archivo,"Arial Narrow",system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
.mono,td.num,th.num,.folio{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:212px 1fr; min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:0 0 24px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:18px 16px 14px; border-bottom:1px solid var(--line); margin-bottom:10px}
.brand .mark{
  display:inline-flex; align-items:center; gap:8px;
  font-family:Archivo,sans-serif; font-weight:700; font-size:15px; letter-spacing:-.02em;
}
.brand .mark i{
  width:22px;height:22px;border-radius:4px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;
}
.brand .sub{font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.09em; margin-top:5px}
.navgroup{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-3);
  padding:14px 16px 5px; font-weight:600}
.navbtn{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:calc(100% - 16px); margin:0 8px; padding:7px 9px; text-align:left;
  background:none; border:0; border-radius:var(--r); cursor:pointer; color:var(--ink-2);
  font-weight:500;
}
.navbtn:hover{background:var(--surface-2); color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.navbtn .cnt{font-size:11px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
.navbtn[aria-current="true"] .cnt{color:var(--accent)}
.navbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--crit);flex:none}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 22px; border-bottom:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; z-index:5;
}
.topbar h1{font-size:19px; font-weight:600}
.topbar .spacer{flex:1}
.status{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.status.on .led{background:var(--ok)}
.status.off .led{background:var(--warn)}
.content{padding:22px; display:flex; flex-direction:column; gap:20px; max-width:1280px; width:100%}

/* ---------- generic bits ---------- */
.section-h{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.section-h h2{font-size:13px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; color:var(--ink-2)}
.section-h .hint{font-size:12px; color:var(--ink-3)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.panel-pad{padding:16px}

.btn{
  border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--r);
  padding:7px 13px; cursor:pointer; font-weight:500;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.danger{color:var(--crit); border-color:var(--line)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:4px 9px; font-size:12px}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}

label.f{display:flex; flex-direction:column; gap:5px; font-size:11px; text-transform:uppercase;
  letter-spacing:.07em; color:var(--ink-2); font-weight:600}
label.f > input, label.f > select, label.f > textarea{
  border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--r);
  padding:7px 9px; font-size:14px; text-transform:none; letter-spacing:0; font-weight:400; width:100%;
}
label.f > input[type=number]{font-family:"IBM Plex Mono",monospace}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.formrow{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}

table{border-collapse:collapse; width:100%; font-size:13px}
.tablewrap{overflow-x:auto}
th{
  text-align:left; font-family:Archivo,sans-serif; font-size:10px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-3); font-weight:600; padding:9px 10px;
  border-bottom:1px solid var(--line-strong); white-space:nowrap; background:var(--surface);
}
td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right}
.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13px}

.tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:3px; background:var(--surface-3); color:var(--ink-2);
  white-space:nowrap; letter-spacing:.02em;
}
.tag.ok{background:var(--ok-soft); color:var(--ok)}
.tag.warn{background:var(--warn-soft); color:var(--warn)}
.tag.crit{background:var(--crit-soft); color:var(--crit)}
.tag .zdot{width:7px;height:7px;border-radius:2px;flex:none}
.z-secos{--z:var(--z-secos)} .z-verdura{--z:var(--z-verdura)}
.z-carnico{--z:var(--z-carnico)} .z-congelador{--z:var(--z-congelador)}
.zdot{background:var(--z,var(--ink-3))}

/* ---------- zone tiles ---------- */
.zones{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.zone{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px 14px; display:flex; flex-direction:column; gap:9px;
  border-top:3px solid var(--z,var(--accent)); text-align:left; cursor:pointer; font:inherit; color:inherit;
}
.zone:hover{border-color:var(--line-strong)}
.zone .zname{font-family:Archivo,sans-serif; font-weight:600; font-size:14px}
.zone .ztemp{font-size:11px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
.zone .zrow{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.zone .zval{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:500; letter-spacing:-.02em}
.zone .zlbl{font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em}
.zone .zalerts{display:flex; gap:5px; flex-wrap:wrap; min-height:20px}

/* ---------- alerts / lines ---------- */
.alertlist{display:flex; flex-direction:column}
.alertitem{display:flex; gap:11px; align-items:flex-start; padding:10px 14px; border-bottom:1px solid var(--line)}
.alertitem:last-child{border-bottom:0}
.alertitem .stripe{width:3px; align-self:stretch; border-radius:2px; background:var(--ink-3); flex:none}
.alertitem.crit .stripe{background:var(--crit)}
.alertitem.warn .stripe{background:var(--warn)}
.alertitem .body{flex:1; min-width:0}
.alertitem .t{font-weight:600}
.alertitem .d{font-size:12px; color:var(--ink-2)}

.banner{
  display:flex; gap:12px; align-items:flex-start; padding:11px 14px; border-radius:var(--r);
  border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); font-size:13px;
}
.banner.info{border-color:var(--accent-line); background:var(--accent-soft); color:var(--accent)}
.banner .spacer{flex:1}
.banner strong{font-weight:600}

.lines{display:flex; flex-direction:column; gap:8px}
.line{display:grid; grid-template-columns:2.2fr 1fr 1fr auto; gap:8px; align-items:end}
.line .rm{align-self:end}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.kpi{padding:13px 15px; border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); font-weight:600}
.kpi .v{font-family:"IBM Plex Mono",monospace; font-size:21px; font-weight:500; margin-top:3px; letter-spacing:-.02em}
.kpi .s{font-size:11px; color:var(--ink-2); margin-top:1px}

.meter{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; background:var(--accent)}
.meter i.ok{background:var(--ok)} .meter i.warn{background:var(--warn)} .meter i.crit{background:var(--crit)}

.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:12px}
.filters label.f{min-width:130px}
.chipbar{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line-strong); background:var(--surface); border-radius:20px;
  padding:4px 11px; font-size:12px; cursor:pointer; font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}

details.lotes summary{cursor:pointer; font-size:12px; color:var(--accent); list-style:none}
details.lotes summary::-webkit-details-marker{display:none}
details.lotes .lt{font-size:12px; color:var(--ink-2); padding:3px 0 0}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:var(--r);
  box-shadow:var(--shadow); font-size:13px; font-weight:500; z-index:50; max-width:min(92vw,460px);
}
.toast.err{background:var(--crit); color:#fff}

.muted{color:var(--ink-3)}
.small{font-size:12px}
.right{text-align:right}
.stack{display:flex; flex-direction:column; gap:16px}
.rowwrap{display:flex; gap:16px; flex-wrap:wrap}
.rowwrap > *{flex:1 1 300px; min-width:0}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; flex-direction:row; overflow-x:auto; padding:0 8px 8px;
    border-right:0; border-bottom:1px solid var(--line); align-items:center; gap:4px}
  .brand{border-bottom:0; padding:12px 8px 12px 8px; margin:0; flex:none}
  .brand .sub{display:none}
  .navgroup{display:none}
  .navbtn{width:auto; margin:0; white-space:nowrap; flex:none}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .line{grid-template-columns:1fr 1fr; }
  .line .rm{grid-column:2; justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="shell">
  <nav class="rail" id="rail">
    <div class="brand">
      <span class="mark"><i>M</i> Producción Matriz</span>
      <div class="sub">Bodega &middot; Cuarto frío &middot; Congelador</div>
    </div>
    <div class="navgroup">Operación</div>
    <button class="navbtn" data-view="tablero">Tablero <span class="dot" id="navdot" hidden></span></button>
    <button class="navbtn" data-view="recepcion">Recepción</button>
    <button class="navbtn" data-view="produccion">Producción <span class="cnt" id="cnt-ord"></span></button>
    <button class="navbtn" data-view="despacho">Despachos</button>
    <button class="navbtn" data-view="ajustes">Mermas y ajustes</button>
    <div class="navgroup">Inventario</div>
    <button class="navbtn" data-view="conteo">Conteo y pedido</button>
    <button class="navbtn" data-view="existencias">Existencias <span class="cnt" id="cnt-ex"></span></button>
    <button class="navbtn" data-view="movimientos">Movimientos <span class="cnt" id="cnt-mov"></span></button>
    <div class="navgroup">Catálogo</div>
    <button class="navbtn" data-view="articulos">Artículos <span class="cnt" id="cnt-art"></span></button>
    <button class="navbtn" data-view="recetas">Recetas <span class="cnt" id="cnt-rec"></span></button>
    <button class="navbtn" data-view="almacenes">Almacenes</button>
  </nav>

  <div class="main">
    <header class="topbar">
      <h1 id="viewtitle">Tablero</h1>
      <div class="spacer"></div>
      <span class="status" id="status"><span class="led"></span><span id="statustxt">Conectando…</span></span>
      <span class="small muted mono" id="today"></span>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
"use strict";

/* ===========================================================
   Producción Matriz — control de bodega y producción
   Datos: capacidad `db` del artifact (compartida entre el equipo).
   Sin db disponible, trabaja en modo local en este navegador.
   =========================================================== */

const COLS = ["almacenes","articulos","recetas","movimientos","ordenes"];

/* Los almacenes replican las secciones de INV_MATRIZ.xlsx, más el cuarto frío de cárnicos. */
const ALMACENES_FALLBACK = [
  {id:"bodega",      nombre:"Bodega de secos",             zona:"secos",       temp:"Ambiente", orden:1},
  {id:"refrigerado", nombre:"Refrigerado · Lácteos y varios", zona:"refrigerado", temp:"2 a 6 °C", orden:2},
  {id:"verdura",     nombre:"Cuarto frío · Verdura",       zona:"verdura",     temp:"2 a 6 °C", orden:3},
  {id:"carnico",     nombre:"Cuarto frío · Cárnicos",      zona:"carnico",     temp:"0 a 4 °C", orden:4},
  {id:"cafeterias",  nombre:"Congelador · Al vacío",       zona:"congelador",  temp:"−18 °C",   orden:5},
  {id:"limpieza",    nombre:"Limpieza",                    zona:"noalimento",  temp:"Ambiente", orden:6},
  {id:"desechables", nombre:"Desechables",                 zona:"noalimento",  temp:"Ambiente", orden:7}
];

const TIPOS = {
  entrada:    {label:"Recepción",   signo:+1},
  produccion: {label:"Producción",  signo:+1},
  consumo:    {label:"Consumo",     signo:-1},
  despacho:   {label:"Despacho",    signo:-1},
  merma:      {label:"Merma",       signo:-1},
  ajuste:     {label:"Ajuste",      signo: 0},
  traspaso:   {label:"Traspaso",    signo: 0}
};

/* Unidades tal como vienen en tu inventario, son unidades de compra. */
const UNIDADES = ["KG","GAL","LT","1/2 LT","PZ","BOLSA","CAJA","LATA","BOTE","BARRA","SACO","TIRA","CUB","BID","PQT","G","ML","PORCION"];
const MOTIVOS_MERMA = ["Caducidad","Daño o descompostura","Merma de proceso","Ruptura de cadena de frío","Error de preparación","Devolución","Otro"];

/* ---------- estado ---------- */
const state = {almacenes:[], articulos:[], recetas:[], movimientos:[], ordenes:[]};
let view = "tablero";
let db = null, localMode = false;
const filtros = {existencias:{almacen:"", texto:"", soloAlerta:false}, movimientos:{tipo:"", almacen:"", texto:""}};

/* ---------- utilidades ---------- */
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,a,...kids)=>{
  const n=document.createElement(t);
  for(const k in (a||{})){
    const v=a[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k==="text") n.textContent=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c===null||c===undefined||c===false) continue;
    n.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); }
  return n;
};
const uid = p => (p||"") + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoy = () => new Date().toISOString().slice(0,10);
const nf = (v,d) => (Number(v)||0).toLocaleString("es-MX",{minimumFractionDigits:d===undefined?2:d, maximumFractionDigits:d===undefined?2:d});
const qty = v => { const n=Number(v)||0; return n.toLocaleString("es-MX",{maximumFractionDigits:3}); };
const money = v => "$" + nf(v,2);
const fecha = s => { if(!s) return "—"; const [y,m,d]=String(s).slice(0,10).split("-"); return d+"/"+m+"/"+y; };
const diasA = s => { if(!s) return null; return Math.round((new Date(s+"T00:00:00") - new Date(hoy()+"T00:00:00"))/86400000); };
const num = v => { const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };

function toast(msg, err){
  const t = el("div",{class:"toast"+(err?" err":""), text:msg, role:"status"});
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), err?5200:2600);
}

/* ---------- capa de datos ---------- */
const listeners = [];
function onData(fn){ listeners.push(fn); }
function emit(){ listeners.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); }

const LS = "matriz.v1.";
function lsRead(c){ try{ return JSON.parse(localStorage.getItem(LS+c) || "[]"); }catch(e){ return []; } }
function lsWrite(c,rows){ try{ localStorage.setItem(LS+c, JSON.stringify(rows)); }catch(e){} }

async function put(col, id, obj){
  const row = Object.assign({}, obj, {id});
  if(db){ await db.collection(col).doc(id).set(obj); return row; }
  const rows = lsRead(col).filter(r=>r.id!==id); rows.push(row); lsWrite(col,rows);
  state[col] = rows; emit(); return row;
}
async function del(col, id){
  if(db){ await db.collection(col).doc(id).delete(); return; }
  const rows = lsRead(col).filter(r=>r.id!==id); lsWrite(col,rows);
  state[col] = rows; emit();
}
async function putMany(col, items){
  for(const it of items){ await put(col, it.id || uid(), it.data || it); }
}

function setStatus(kind, txt){
  const s=$("#status"); s.className = "status " + kind; $("#statustxt").textContent = txt;
}

async function initData(){
  try{ db = await claude.use("db"); }catch(e){ db = null; }
  if(!db){
    localMode = true;
    COLS.forEach(c => state[c] = lsRead(c));
    if(!state.almacenes.length){ lsWrite("almacenes", ALMACENES_FALLBACK.map(a=>Object.assign({},a))); state.almacenes = lsRead("almacenes"); }
    setStatus("off","Modo local, solo este navegador");
    emit();
    return;
  }
  setStatus("on","Datos compartidos");
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(
      snap => {
        state[col] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
        if(col==="almacenes" && !state.almacenes.length) state.almacenes = ALMACENES_FALLBACK.map(a=>Object.assign({},a));
        emit();
      },
      err => {
        console.warn(col, err);
        setStatus("off", err.code==="revoked" ? "Acceso retirado" : "Sin conexión al almacén de datos");
      }
    );
  });
}

/* ---------- derivaciones ---------- */
function almacenes(){
  const a = state.almacenes.length ? state.almacenes.slice() : ALMACENES_FALLBACK;
  return a.sort((x,y)=>(x.orden||99)-(y.orden||99) || String(x.nombre).localeCompare(String(y.nombre)));
}
function alm(id){ return almacenes().find(a=>a.id===id) || {id, nombre:id||"—", zona:"", temp:""}; }
function art(id){ return state.articulos.find(a=>a.id===id) || null; }
function artNombre(id){ const a=art(id); return a?a.nombre:"(artículo eliminado)"; }
function artUnidad(id){ const a=art(id); return a?a.unidad:""; }

/* saldo = suma de movimientos; sin dobles escrituras que se puedan desincronizar */
function saldos(){
  const map = new Map(); // artId|almacen -> {cantidad, lotes:Map(lote->{cant,cad})}
  for(const m of state.movimientos){
    if(!m.articuloId || !m.almacen) continue;
    const k = m.articuloId + "|" + m.almacen;
    let e = map.get(k);
    if(!e){ e = {articuloId:m.articuloId, almacen:m.almacen, cantidad:0, lotes:new Map()}; map.set(k,e); }
    const c = Number(m.cantidad)||0;
    e.cantidad += c;
    const lote = m.lote || "sin lote";
    let L = e.lotes.get(lote);
    if(!L){ L = {lote, cantidad:0, caducidad:m.caducidad||null}; e.lotes.set(lote,L); }
    L.cantidad += c;
    if(m.caducidad && !L.caducidad) L.caducidad = m.caducidad;
  }
  return map;
}
function saldoDe(artId, almacenId){
  let t=0;
  for(const m of state.movimientos){
    if(m.articuloId!==artId) continue;
    if(almacenId && m.almacen!==almacenId) continue;
    t += Number(m.cantidad)||0;
  }
  return t;
}
function costoProm(artId){
  let c=0,q=0;
  for(const m of state.movimientos){
    if(m.articuloId!==artId) continue;
    if(m.tipo!=="entrada" || !m.costoUnit) continue;
    const k = Math.abs(Number(m.cantidad)||0);
    c += k * Number(m.costoUnit); q += k;
  }
  if(q>0) return c/q;
  const a = art(artId);
  return a && a.costoRef ? Number(a.costoRef) : 0;
}

/* alertas: bajo mínimo, por caducar, vencido, saldo negativo */
function alertas(){
  const out=[], S=saldos();
  for(const a of state.articulos){
    if(a.activo===false) continue;
    const total = saldoDe(a.id);
    if(a.stockMin && total < Number(a.stockMin)){
      out.push({nivel: total<=0 ? "crit":"warn", clase:"minimo", articuloId:a.id, almacen:a.almacen,
        titulo:a.nombre, detalle:"Existencia "+qty(total)+" "+a.unidad+", mínimo "+qty(a.stockMin)+" "+a.unidad});
    }
    if(total < -0.0001){
      out.push({nivel:"crit", clase:"negativo", articuloId:a.id, almacen:a.almacen,
        titulo:a.nombre, detalle:"Saldo negativo de "+qty(total)+" "+a.unidad+", revisa capturas o conteo"});
    }
  }
  for(const [,e] of S){
    for(const [,L] of e.lotes){
      if(L.cantidad<=0.0001 || !L.caducidad) continue;
      const d = diasA(L.caducidad);
      if(d===null) continue;
      if(d<0) out.push({nivel:"crit", clase:"vencido", articuloId:e.articuloId, almacen:e.almacen,
        titulo:artNombre(e.articuloId), detalle:"Lote "+L.lote+" venció hace "+Math.abs(d)+" día(s), "+qty(L.cantidad)+" "+artUnidad(e.articuloId)+" en "+alm(e.almacen).nombre});
      else if(d<=7) out.push({nivel:"warn", clase:"porcaducar", articuloId:e.articuloId, almacen:e.almacen,
        titulo:artNombre(e.articuloId), detalle:"Lote "+L.lote+" caduca en "+d+" día(s), "+qty(L.cantidad)+" "+artUnidad(e.articuloId)+" en "+alm(e.almacen).nombre});
    }
  }
  const rank={crit:0,warn:1};
  return out.sort((a,b)=>rank[a.nivel]-rank[b.nivel]);
}

/* rendimiento de una orden: salida / entrada, solo si las unidades son de peso */
function rendimiento(orden){
  const peso = u => { u=String(u||"").toUpperCase(); return u==="KG" ? 1 : u==="G" ? 0.001 : null; };
  let ent=0, sal=0, ok=true;
  for(const c of (orden.consumos||[])){ const f=peso(artUnidad(c.articuloId)); if(f===null){ok=false;break;} ent += num(c.cantidad)*f; }
  for(const s of (orden.salidas||[])){ const f=peso(artUnidad(s.articuloId)); if(f===null){ok=false;break;} sal += num(s.cantidad)*f; }
  if(!ok || ent<=0) return null;
  return {entrada:ent, salida:sal, pct: sal/ent*100, merma: ent-sal};
}

/* ---------- Mermas y ajustes ---------- */
function vAjustes(c){
  const iFecha=el("input",{type:"date", value:hoy()});
  const sArt=selArticulo(""), sAlm=selAlmacen("");
  const sLote=el("span",{}); let loteSel=null;
  const iCant=el("input",{type:"number", step:"0.001", min:"0", placeholder:"0.000"});
  const sMotivo=el("select",{}, MOTIVOS_MERMA.map(m=>el("option",{value:m, text:m})));
  const iResp=el("input",{type:"text", placeholder:"Quién reporta"});
  const iNota=el("input",{type:"text", placeholder:"Detalle"});
  const dispTxt=el("div",{class:"small muted", text:"Elige artículo y almacén para ver el saldo."});

  function refrescaLote(){
    sLote.innerHTML="";
    const s = selLote(sArt.value, sAlm.value, loteSel);
    s.addEventListener("change", ()=>{ loteSel=s.value; });
    sLote.appendChild(s);
    if(sArt.value && sAlm.value){
      const d = saldoDe(sArt.value, sAlm.value);
      dispTxt.textContent = "Saldo actual en sistema: "+qty(d)+" "+artUnidad(sArt.value)+".";
    }
  }
  sArt.addEventListener("change", ()=>{ const a=art(sArt.value); if(a&&a.almacen&&!sAlm.value) sAlm.value=a.almacen; refrescaLote(); });
  sAlm.addEventListener("change", refrescaLote);

  async function merma(){
    if(!sArt.value||!sAlm.value) return toast("Elige el artículo y el almacén.", true);
    const q=num(iCant.value); if(q<=0) return toast("La cantidad de merma debe ser mayor que cero.", true);
    await put("movimientos", uid("mov-"), {ts:new Date().toISOString(), fecha:iFecha.value||hoy(), tipo:"merma",
      articuloId:sArt.value, almacen:sAlm.value, cantidad:-Math.abs(q), lote:loteSel||null,
      motivo:sMotivo.value, responsable:iResp.value.trim()||null, nota:iNota.value.trim()||null});
    toast("Merma registrada: "+qty(q)+" "+artUnidad(sArt.value)+" de "+artNombre(sArt.value));
    iCant.value=""; iNota.value=""; refrescaLote();
  }
  async function ajuste(){
    if(!sArt.value||!sAlm.value) return toast("Elige el artículo y el almacén.", true);
    const contado=num(iCant.value);
    const actual=saldoDe(sArt.value, sAlm.value);
    const dif = contado - actual;
    if(Math.abs(dif)<0.0001) return toast("El conteo coincide con el sistema, no hay nada que ajustar.");
    if(!confirm("Conteo físico: "+qty(contado)+"\nSistema: "+qty(actual)+"\nDiferencia: "+qty(dif)+
      "\n\n¿Aplicar el ajuste para dejar la existencia en "+qty(contado)+"?")) return;
    await put("movimientos", uid("mov-"), {ts:new Date().toISOString(), fecha:iFecha.value||hoy(), tipo:"ajuste",
      articuloId:sArt.value, almacen:sAlm.value, cantidad:dif, lote:loteSel||null,
      motivo:"Conteo físico", responsable:iResp.value.trim()||null,
      nota:(iNota.value.trim()? iNota.value.trim()+" · ":"")+"Contado "+qty(contado)+", sistema "+qty(actual)});
    toast("Ajuste aplicado. La existencia queda en "+qty(contado)+" "+artUnidad(sArt.value));
    iCant.value=""; iNota.value=""; refrescaLote();
  }

  c.appendChild(el("section",{},
    el("div",{class:"section-h"}, el("h2",{text:"Merma o ajuste por conteo"}),
      el("span",{class:"hint", text:"Merma descuenta lo capturado. El ajuste deja la existencia igual a tu conteo."})),
    el("div",{class:"panel panel-pad stack"},
      el("div",{class:"formgrid"},
        el("label",{class:"f"}, "Fecha", iFecha),
        el("label",{class:"f"}, "Artículo", sArt),
        el("label",{class:"f"}, "Almacén", sAlm),
        el("label",{class:"f"}, "Lote", sLote),
        el("label",{class:"f"}, "Cantidad", iCant),
        el("label",{class:"f"}, "Motivo de merma", sMotivo),
        el("label",{class:"f"}, "Reporta", iResp),
        el("label",{class:"f"}, "Nota", iNota)),
      dispTxt,
      el("div",{class:"formrow"},
        el("button",{class:"btn primary", onclick:merma, text:"Registrar merma"}),
        el("button",{class:"btn", onclick:ajuste, text:"Aplicar como conteo físico"}),
        el("span",{class:"small muted", text:"Con conteo físico, la cantidad es lo que contaste en piso."})))));
  refrescaLote();
  c.appendChild(tablaMovs(state.movimientos.filter(m=>m.tipo==="merma"||m.tipo==="ajuste"), "Mermas y ajustes recientes", ["motivo"]));

async function exportarCSV(){
  const head=["fecha","tipo","codigo","articulo","unidad","almacen","cantidad","lote","caducidad","costo_unitario","contraparte","documento","motivo","responsable","nota"];
  const esc = v => '"'+String(v===null||v===undefined?"":v).replace(/"/g,'""')+'"';
  const lines=[head.join(",")];
  state.movimientos.slice().sort((a,b)=>String(a.ts||"").localeCompare(String(b.ts||""))).forEach(m=>{
    const a=art(m.articuloId)||{};
    lines.push([m.fecha,(TIPOS[m.tipo]||{}).label||m.tipo,a.codigo,a.nombre,a.unidad,alm(m.almacen).nombre,
      m.cantidad,m.lote,m.caducidad,m.costoUnit,m.contraparte,m.documento,m.motivo,m.responsable,m.nota].map(esc).join(","));
  });
  const csv="﻿"+lines.join("\n");
  let d=null;
  try{ if(window.claude && claude.use) d = await claude.use("downloads"); }catch(e){ d=null; }
  if(d){
    try{ await d.save({filename:"movimientos-matriz-"+hoy()+".csv", data:csv}); toast("Archivo listo para guardar."); return; }
    catch(e){ /* el visor lo puede rechazar; seguimos al respaldo */ }
  }
  try{ await navigator.clipboard.writeText(csv); toast("CSV copiado al portapapeles, pégalo en tu hoja de cálculo."); }
  catch(e){ toast("No se pudo exportar desde este visor.", true); }
}

        el("label",{class:"f"}, "Orden", iOrden)),
      el("button",{class:"btn primary", style:"align-self:flex-start", text:"Agregar almacén", onclick:async()=>{
        const id=iId.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
        if(!id) return toast("La clave solo admite letras, números, guion y guion bajo.", true);
        if(!iNom.value.trim()) return toast("Ponle un nombre al almacén.", true);
        if(almacenes().some(a=>a.id===id)) return toast("Ya existe un almacén con esa clave.", true);
        await put("almacenes", id, {nombre:iNom.value.trim(), zona:sZona.value,
          temp:iTemp.value.trim()||null, orden: iOrden.value? num(iOrden.value): almacenes().length+1});
        toast("Almacén agregado.");
        iId.value=""; iNom.value=""; iTemp.value=""; iOrden.value="";
      }}))));

  const tb=el("tbody",{});
  almacenes().forEach(a=>{
    const usos = state.movimientos.filter(m=>m.almacen===a.id).length;
    tb.appendChild(el("tr",{},
      el("td",{class:"mono small", text:a.id}),
      el("td",{}, el("span",{class:"tag"}, el("span",{class:"zdot", style:"background:var(--z-"+(a.zona||"")+")"}), a.nombre)),
      el("td",{class:"mono small", text:a.temp||"—"}),
      el("td",{class:"num mono", text:String(usos)}),
      el("td",{class:"right"}, el("button",{class:"btn ghost sm danger", text:"Borrar", onclick:async()=>{
        if(usos) return toast("No se puede borrar: hay "+usos+" movimiento(s) en "+a.nombre+".", true);
        if(!confirm("Borrar el almacén "+a.nombre+"?")) return;
        await del("almacenes", a.id); toast("Almacén borrado.");
      }}))));
  });
  c.appendChild(el("section",{},
    el("div",{class:"section-h"}, el("h2",{text:"Almacenes configurados"})),
    el("div",{class:"panel tablewrap"}, el("table",{},
      el("thead",{}, el("tr",{}, el("th",{text:"Clave"}), el("th",{text:"Nombre"}), el("th",{text:"Temperatura"}),
        el("th",{class:"num",text:"Movimientos"}), el("th",{}))), tb))));
}

/* ---------- Conteo físico y pedido ----------
   Replica la hoja impresa: columnas MIN | FINAL | U.
   En FINAL se acepta un número o una palomita, que significa
   "hay suficiente, no pedir" sin comprometer una cantidad.
   La foto de la hoja se puede leer para llenar la captura.        */
const conteo = {almacen:"", fecha:hoy(), responsable:"", valores:{}, leyendo:false, aviso:null};
const OK = "OK";  // la palomita

function vConteo(c){
  const alms = almacenes();
  if(!conteo.almacen || !alms.some(a=>a.id===conteo.almacen)) conteo.almacen = (alms[0]||{}).id || "";

  const chips = el("div",{class:"chipbar"},
    alms.map(a=>{
      const n = state.articulos.filter(x=>x.almacen===a.id && x.activo!==false).length;
      return el("button",{class:"chip", "aria-pressed":String(conteo.almacen===a.id),
        onclick:()=>{ conteo.almacen=a.id; conteo.aviso=null; render(); }, text:a.nombre+" ("+n+")"});
    }));

  const iFecha=el("input",{type:"date", id:"conteo-fecha", value:conteo.fecha});
  iFecha.addEventListener("change",()=>{ conteo.fecha=iFecha.value; });
  const iResp=el("input",{type:"text", id:"conteo-resp", value:conteo.responsable, placeholder:"Quién cuenta"});
  iResp.addEventListener("input",()=>{ conteo.responsable=iResp.value; });

  const arts = state.articulos
    .filter(a=>a.almacen===conteo.almacen && a.activo!==false)
    .sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));

  const tb = el("tbody",{}), kpiBox = el("div",{class:"kpis"});

  const contadoDe = a => {
    const v = conteo.valores[a.id];
    if(v===undefined || v==="") return null;
    if(v===OK) return OK;
    return num(v);
  };
  /* Tu fórmula: COM = MIN - INV. Con palomita no se pide nada. */
  function pedidoDe(a){
    const cont = contadoDe(a);
    if(cont===OK) return 0;
    const base = cont===null ? saldoDe(a.id, conteo.almacen) : cont;
    return (Number(a.stockMin)||0) - base;
  }
  function refrescaKpis(){
    const contados = arts.filter(a=>contadoDe(a)!==null).length;
    const palomas = arts.filter(a=>contadoDe(a)===OK).length;
    const pedir = arts.filter(a=>pedidoDe(a)>0).length;
    const pct = arts.length ? contados/arts.length*100 : 0;
    kpiBox.innerHTML="";
    kpiBox.appendChild(el("div",{class:"kpi"}, el("div",{class:"k",text:"Artículos de la sección"}),
      el("div",{class:"v",text:String(arts.length)})));
    kpiBox.appendChild(el("div",{class:"kpi"}, el("div",{class:"k",text:"Ya capturados"}),
      el("div",{class:"v",text:contados+" / "+arts.length}),
      el("div",{class:"meter"}, el("i",{class:(pct>=100?"ok":pct>0?"warn":""), style:"width:"+pct+"%"}))));
    kpiBox.appendChild(el("div",{class:"kpi"}, el("div",{class:"k",text:"Con palomita"}),
      el("div",{class:"v",text:String(palomas)}), el("div",{class:"s",text:"hay, sin cantidad"})));
    kpiBox.appendChild(el("div",{class:"kpi"}, el("div",{class:"k",text:"Líneas por pedir"}),
      el("div",{class:"v",text:String(pedir)}), el("div",{class:"s",text:"COM = MIN menos INV"})));
  }

  function pinta(){
    tb.innerHTML="";
    if(!arts.length){
      tb.appendChild(el("tr",{}, el("td",{colspan:"7"}, el("div",{class:"empty",
        text:"Esta sección todavía no tiene artículos. Dalos de alta en el catálogo."}))));
    }
    arts.forEach(a=>{
      const sis = saldoDe(a.id, conteo.almacen);
      const celdaPed = el("td",{class:"num mono"});
      const celdaDif = el("td",{class:"num mono"});
      const v = conteo.valores[a.id];
      const inp = el("input",{type:"number", step:"0.001", min:"0", placeholder:"—",
        id:"cnt-"+a.id, value: (v===undefined||v===OK) ? "" : v,
        style:"width:88px;text-align:right;padding:5px 7px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);font-family:'IBM Plex Mono',monospace"});
      const btnOK = el("button",{class:"btn sm", "aria-pressed":String(v===OK), title:"Hay suficiente, no pedir",
        style:"padding:5px 9px;"+(v===OK?"background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700":""),
        text:"✓"});
      function refrescaFila(){
        const cont = contadoDe(a);
        const p = pedidoDe(a);
        if(cont===OK){
          celdaPed.textContent = "no pedir";
          celdaPed.style.cssText = "text-align:right;color:var(--ok);font-size:12px";
        }else if(p>0){
          celdaPed.textContent = qty(p)+" "+a.unidad;
          celdaPed.style.cssText = "text-align:right;font-weight:600;color:var(--accent)";
        }else if(p<0){
          celdaPed.textContent = "sobran "+qty(-p);
          celdaPed.style.cssText = "text-align:right;color:var(--ink-3);font-size:12px";
        }else{
          celdaPed.textContent = "al mínimo";
          celdaPed.style.cssText = "text-align:right;color:var(--ok);font-size:12px";
        }
        if(cont===null || cont===OK){
          celdaDif.textContent = cont===OK ? "sin cantidad" : "—";
          celdaDif.style.cssText = "text-align:right;color:var(--ink-3);font-size:12px";
        }else{
          const d = cont - sis;
          celdaDif.textContent = (d>0?"+":"")+qty(d);
          celdaDif.style.cssText = "text-align:right;font-weight:"+(Math.abs(d)<0.0001?"400":"600")+
            ";color:"+(Math.abs(d)<0.0001?"var(--ok)":d<0?"var(--crit)":"var(--warn)");
        }
        refrescaKpis();
      }
      inp.addEventListener("input", ()=>{
        conteo.valores[a.id]=inp.value;
        btnOK.setAttribute("aria-pressed","false"); btnOK.style.cssText="padding:5px 9px;";
        refrescaFila();
      });
      btnOK.addEventListener("click", ()=>{
        if(conteo.valores[a.id]===OK){ delete conteo.valores[a.id]; }
        else { conteo.valores[a.id]=OK; inp.value=""; }
        const on = conteo.valores[a.id]===OK;
        btnOK.setAttribute("aria-pressed",String(on));
        btnOK.style.cssText = "padding:5px 9px;"+(on?"background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700":"");
        refrescaFila();
      });
      tb.appendChild(el("tr",{},
        el("td",{}, el("div",{style:"font-weight:500", text:a.nombre}),
          a.nota? el("div",{class:"small muted", text:a.nota}):null),
        el("td",{class:"mono small muted", text:a.unidad}),
        el("td",{class:"num mono", text: a.stockMin!==null&&a.stockMin!==undefined ? qty(a.stockMin) : "—"}),
        el("td",{class:"num mono muted", text:qty(sis)}),
        el("td",{class:"num", style:"white-space:nowrap"}, inp, " ", btnOK),
        celdaDif, celdaPed));
      refrescaFila();
    });
    refrescaKpis();
  }

  /* ----- leer la foto de la hoja ----- */
  const avisoBox = el("div",{});
  function pintaAviso(){
    avisoBox.innerHTML="";
    if(conteo.aviso) avisoBox.appendChild(el("div",{class:"banner "+(conteo.aviso.tipo||"info")},
      el("div",{}, el("strong",{text:conteo.aviso.titulo+" "}), conteo.aviso.texto),
      el("div",{class:"spacer"}),
      el("button",{class:"btn ghost sm", text:"✕", "aria-label":"Cerrar aviso",
        onclick:()=>{ conteo.aviso=null; pintaAviso(); }})));
  }

  const fileInput = el("input",{type:"file", id:"conteo-foto", accept:"image/*", multiple:true, hidden:true});
  const btnFoto = el("button",{class:"btn", text:"Leer foto de la hoja", hidden:true,
    onclick:()=>fileInput.click()});

  (async ()=>{
    let sample=null;
    try{ sample = await claude.use("sample"); }catch(e){ sample=null; }
    if(!sample) return;
    const lim = await sample.limits().catch(()=>null);
    if(!lim || !lim.images) return;
    fileInput.accept = lim.images.mediaTypes.join(",");
    btnFoto.hidden = false;

    fileInput.addEventListener("change", async ()=>{
      const files = Array.from(fileInput.files||[]).slice(0, lim.images.maxCount);
      fileInput.value = "";
      if(!files.length) return;
      conteo.leyendo = true;
      btnFoto.disabled = true; btnFoto.textContent = "Leyendo la hoja…";
      conteo.aviso = {tipo:"info", titulo:"Leyendo la hoja.", texto:"Puede tardar hasta un minuto."};
      pintaAviso();
      const lista = arts.map(a=>a.nombre).join("\n");
      const prompt =
        "Estas son fotos de una hoja de conteo de inventario de una cocina, llenada a mano.\n"+
        "La tabla tiene las columnas: ARTICULO, MIN, FINAL, U.\n"+
        "Me interesa solo la columna FINAL, que es el conteo físico escrito a mano.\n\n"+
        "Reglas de lectura:\n"+
        "- Si en FINAL hay un número, devuélvelo como número.\n"+
        "- Si en FINAL hay una palomita o tache de verificación, devuelve el texto \"OK\".\n"+
        "- Si la celda FINAL está vacía, no incluyas ese renglón.\n"+
        "- Si junto al número hay una unidad escrita a mano (por ejemplo \"1 caja\"), "+
        "devuelve el número y pon la unidad en el campo nota.\n\n"+
        "Estos son los artículos de esta sección, usa exactamente estos nombres:\n"+lista+"\n\n"+
        "Responde solo con un arreglo JSON de objetos {\"nombre\":\"...\",\"final\":<número o \"OK\">,\"nota\":\"...\"}. "+
        "El campo nota es opcional. Ejemplo: [{\"nombre\":\"ARROZ\",\"final\":30}]";
      try{
        const filas = await sample.json(prompt, {images:files, modelTier:"complex", cache:false});
        if(!Array.isArray(filas)) throw {code:"formato", message:"respuesta inesperada"};
        const norm = s => String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9]/g,"");
        const idx = new Map(); arts.forEach(a=> idx.set(norm(a.nombre), a));
        let ok=0; const nuevas=[], sinMatch=[];
        for(const f of filas){
          const k = norm(f.nombre);
          let a = idx.get(k);
          if(!a) a = arts.find(x=>{ const n=norm(x.nombre); return n.startsWith(k) || k.startsWith(n); });
          if(!a){ sinMatch.push(f.nombre); continue; }
          const val = (String(f.final).toUpperCase()==="OK") ? OK : String(num(f.final));
          conteo.valores[a.id] = val;
          ok++;
          if(f.nota) nuevas.push(a.nombre+": "+f.nota);
        }
        conteo.aviso = {tipo: sinMatch.length? "warn":"info",
          titulo: "Se leyeron "+ok+" renglones.",
          texto: "Revisa las cantidades contra la foto antes de aplicar."+
            (sinMatch.length? " No se reconocieron: "+sinMatch.join(", ")+"." : "")+
            (nuevas.length? " Con unidad escrita a mano: "+nuevas.join("; ")+"." : "")};
        pinta(); pintaAviso();
      }catch(e){
        const copia = {
          not_granted:"No diste permiso para usar Claude en esta página. Captura la hoja a mano.",
          rate_limited:"Hay muchas peticiones en este momento. Inténtalo en un minuto.",
          images_unavailable:"Este visor no acepta imágenes. Captura la hoja a mano.",
          image_rejected:"No se pudo leer esa imagen. Toma la foto de frente y bien iluminada.",
          invalid_json:"La lectura salió incompleta. Vuelve a intentarlo o captura a mano."
        }[e && e.code] || "No se pudo leer la hoja. Captura las cantidades a mano.";
        conteo.aviso = {tipo:"warn", titulo:"No se completó la lectura.", texto:copia};
        pintaAviso();
      }finally{
        conteo.leyendo=false; btnFoto.disabled=false; btnFoto.textContent="Leer foto de la hoja";
      }
    });
  })();

  async function aplicar(){
    const filas = arts.map(a=>({a, cont:contadoDe(a), sis:saldoDe(a.id, conteo.almacen)}));
    const capturados = filas.filter(x=>x.cont!==null).length;
    const palomas = filas.filter(x=>x.cont===OK).length;
    const cambios = filas.filter(x=> x.cont!==null && x.cont!==OK && Math.abs(x.cont - x.sis) > 0.0001);
    if(!capturados) return toast("Captura al menos un conteo antes de aplicar.", true);
    if(!cambios.length) return toast("Nada que ajustar. Los conteos con número coinciden con el sistema.");
    if(!confirm("Aplicar el conteo de "+alm(conteo.almacen).nombre+"?\n\n"+
      cambios.length+" artículo(s) quedarán ajustados a lo que contaste.\n"+
      (palomas? palomas+" con palomita se quedan como están, porque no traen cantidad.\n":"")+
      "\nSe registra un movimiento de ajuste por cada diferencia.")) return;
    for(const x of cambios){
      await put("movimientos", uid("mov-"), {ts:new Date().toISOString(), fecha:conteo.fecha||hoy(),
        tipo:"ajuste", articuloId:x.a.id, almacen:conteo.almacen, cantidad:(x.cont - x.sis), lote:null,
        motivo:"Conteo físico", responsable:conteo.responsable||null,
        nota:"Contado "+qty(x.cont)+" "+x.a.unidad+", sistema "+qty(x.sis)});
    }
    toast("Conteo aplicado. "+cambios.length+" ajuste(s) registrados"+(palomas? ", "+palomas+" con palomita sin tocar":"")+".");
    conteo.valores = {}; conteo.aviso = null;
  }

  async function exportarPedido(){
    const rows = arts.map(a=>({a, p:pedidoDe(a), cont:contadoDe(a)})).filter(x=>x.p>0);
    if(!rows.length) return toast("No hay nada por pedir en esta sección.");
    const esc = v => '"'+String(v===null||v===undefined?"":v).replace(/"/g,'""')+'"';
    const lines = [["SECCION","ARTICULO","MIN","INV","COM","U"].join(",")];
    rows.forEach(x=> lines.push([alm(conteo.almacen).nombre, x.a.nombre, x.a.stockMin,
      x.cont===null? saldoDe(x.a.id, conteo.almacen) : x.cont, x.p, x.a.unidad].map(esc).join(",")));
    const csv = "﻿"+lines.join("\n");
    let d=null;
    try{ if(window.claude && claude.use) d = await claude.use("downloads"); }catch(e){ d=null; }
    if(d){
      try{ await d.save({filename:"pedido-"+conteo.almacen+"-"+(conteo.fecha||hoy())+".csv", data:csv});
        toast("Pedido listo para guardar."); return; }catch(e){}
    }
    try{ await navigator.clipboard.writeText(csv);
      toast("Pedido copiado al portapapeles, pégalo en tu hoja de cálculo."); }
    catch(e){ toast("No se pudo exportar desde este visor.", true); }
  }

  c.appendChild(el("section",{},
    el("div",{class:"section-h"}, el("h2",{text:"Conteo físico y pedido"}),
      el("span",{class:"hint", text:"La columna FINAL de tu hoja. Número, o palomita si hay suficiente"})),
    el("div",{class:"filters"}, chips,
      el("label",{class:"f"}, "Fecha del conteo", iFecha),
      el("label",{class:"f", style:"min-width:170px"}, "Cuenta", iResp),
      btnFoto, fileInput),
    avisoBox,
    kpiBox,
    el("div",{class:"panel tablewrap", style:"margin-top:12px"}, el("table",{},
      el("thead",{}, el("tr",{},
        el("th",{text:"Artículo"}), el("th",{text:"U"}), el("th",{class:"num",text:"MIN"}),
        el("th",{class:"num",text:"Sistema"}), el("th",{class:"num",text:"FINAL"}),
        el("th",{class:"num",text:"Diferencia"}), el("th",{class:"num",text:"COM"}))), tb)),
    el("div",{class:"formrow", style:"margin-top:12px"},
      el("button",{class:"btn primary", onclick:aplicar, text:"Aplicar conteo al inventario"}),
      el("button",{class:"btn", onclick:exportarPedido, text:"Exportar pedido"}),
      el("button",{class:"btn ghost", text:"Limpiar captura",
        onclick:()=>{ conteo.valores={}; conteo.aviso=null; render(); }}),
      el("span",{class:"small muted", text:"La palomita no mueve la existencia, solo evita que se pida."}))));
  pinta(); pintaAviso();
}

const VIEWS = {tablero:vTablero, recepcion:vRecepcion, produccion:vProduccion, despacho:vDespacho,
  ajustes:vAjustes, existencias:vExistencias, conteo:vConteo, movimientos:vMovimientos, articulos:vArticulos,
  recetas:vRecetas, almacenes:vAlmacenes};

function go(v){ view=v; try{ location.hash=v; }catch(e){} render(); window.scrollTo({top:0}); }
document.querySelectorAll(".navbtn").forEach(b=> b.addEventListener("click", ()=>go(b.dataset.view)));
window.addEventListener("hashchange", ()=>{ const v=location.hash.slice(1); if(VIEWS[v] && v!==view){ view=v; render(); } });

$("#today").textContent = new Date().toLocaleDateString("es-MX",{weekday:"long", day:"numeric", month:"long"});
if(VIEWS[location.hash.slice(1)]) view = location.hash.slice(1);

onData(render);
render();
initData();
</script>
